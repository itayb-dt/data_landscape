  target: Electric (ElectricSQL)
  target_abbr: EL
  target_color: "#a78bfa"
  value: "Undisclosed"
  headline: Databricks acquires Electric to give AI agents a local Postgres that syncs with Lakebase
  tldr: The team behind PGlite (embedded WASM Postgres) and the Electric sync engine joins Neon at Databricks to add reactivity to Lakebase. Neon has since shipped live queries.
  why:
    - "<b>The other end of the wire.</b> Lakebase is the central database; PGlite is the Postgres inside the agent."
    - "<b>Sync as a primitive.</b> Agents and apps need current data without hand-built sync."
    - "<b>Same Postgres roots.</b> PGlite builds on WASM Postgres work by Neon co-founder Stas Kelvich."
  take_label: Worth watching
  take: "Live queries on Lakebase Postgres: any SQL query becomes a live subscription."
  facts:
