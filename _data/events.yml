- type: acq
  date: 2026-08-26
  when: "Aug 26"
  acquirer: AWS
  acquirer_abbr: AW
  acquirer_color: "#ffb86b"
  target: DuckLabs
  target_abbr: DL
  target_color: "#f4e04d"
  status: Pending
  value: "Undisclosed"
  headline: AWS acquires DuckLabs to bring DuckDB's in-process analytics closer to S3
  tldr: AWS acquires DuckLabs, not the DuckDB project. DuckDB stays MIT-licensed under the independent DuckDB Foundation.
  why:
    - "<b>They already worked together.</b> DuckDB support landed in Amazon S3 Tables and SageMaker Lakehouse."
    - "<b>More analytics against S3.</b> The more queries run on data in S3, the more AWS wins."
    - "<b>A sustainable home for the project.</b> AWS will fund the open source work instead of support contracts."
  take_label: My take
  take: "DuckDB, S3 and SQL give users what they want: fast reads on a lot of data, cheap storage, and simplicity. Postgres is again the starting point, even for analytics."
  facts:
    - {label: Announced, value: "Aug 26, 2026"}
    - {label: Value, value: Undisclosed}
    - {label: Category, value: Embedded OLAP}
    - {label: Open source, value: "Stays MIT (DuckDB Foundation)"}
