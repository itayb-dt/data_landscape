# Main events file. Every funding round and acquisition worth recording goes here.
#
# Required:  type (acq|fund), date, when
#            acq:  acquirer, target, value  (status is no longer shown; ignore it)
#            fund: company, stage  (amount and valuation are optional)
# Window:    funding rounds older than 3 years are not listed here. Full funding history belongs
#            inside an article (see the Funding history section), not in this file.
# Optional:  source  (URL of the announcement, shown for events without analysis)
#            post    (URL of our analysis; marks the event as analysed and adds a card
#                     to the detailed view. A card also needs the card fields below.)
# `when` is the label shown on the timeline; `date` positions the dot in the overview strip.
