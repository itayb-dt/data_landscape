# Main events file. Every funding round and acquisition worth recording goes here.
#
# Required:  type (acq|fund|shut), date, when
#            shut: company, stage, headline, tldr, nums, signal, area, post  (startup shutdowns and insolvencies)
#            acq:  acquirer, target, value  (status is no longer shown; ignore it)
#            fund: company, stage  (amount and valuation are optional)
# Window:    funding rounds older than 3 years are not listed here (exception: rounds that have an article). Full funding history belongs
#            inside an article (see the Funding history section), not in this file.
# Optional:  source  (URL of the announcement, shown for events without analysis)
#            post    (URL of our analysis; marks the event as analysed and adds a card
#                     to the detailed view. A card also needs the card fields below.)
# `when` is the label shown on the timeline; `date` positions the dot in the overview strip.
- type: shut
  date: 2026-11-03
  when: "Nov 3"
  company: Explorium
  abbr: EX
  color: "#ff7b7b"
  stage: Ceasing operations
  headline: Explorium, the external data platform that raised over $127M, shuts down after almost nine years
  tldr: The Israeli company sold outside data to improve analytics and machine learning, and later offered the same data to AI agents. AgentSource closes on December 2, 2026.
  nums:
    - {label: Raised, value: "$127M+"}
    - {label: Founded, value: "2017"}
    - {label: Last round, value: "2021"}
  signal: Explorium sold outside data to improve models, then offered the same data to agents. As machine learning became a commodity, data alone was not enough.
  area: External data for analytics and AI
  post: /blog_posts/shutdown/026_SHUTDOWN_explorium_external_data.html

- type: shut
  date: 2026-05-18
  when: "May 18"
  company: SQream
  abbr: SQ
  color: "#ff7b7b"
  stage: Insolvency
  headline: SQream, the GPU database that raised over $120M, enters insolvency and heads for a court-run sale
  tldr: The company, now called Scailium, filed in the Tel Aviv District Court. A trustee is inviting bids for the company or its operations.
  nums:
