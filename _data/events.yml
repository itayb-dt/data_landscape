  acquirer_color: "#ff6b5b"
  target: Responsive
  target_abbr: RS
  target_color: "#e5e7eb"
  value: "Undisclosed"
  headline: Databricks acquires Responsive to bring object-storage-native database engineering to Lakebase
  tldr: The founders of SlateDB, an open source database engine built on object storage, join Databricks to accelerate Lakebase and Neon. SlateDB stays independent.
  why:
    - "<b>Same architecture.</b> Lakebase separates storage and compute and keeps data on object storage."
    - "<b>The hard part underneath.</b> An engine that makes object storage fast enough for online workloads."
    - "<b>One copy of data.</b> Supports LTAP: transactional and analytical engines on the same open data."
  take_label: Worth watching
  take: "SlateDB stays independently governed (Commonhaus), so the open source engine does not become a Databricks product."
  facts:
