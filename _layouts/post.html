---
layout: default
---
<article class="post">
  <div class="eyebrow">{{ page.category }}</div>
  {% if page.show_title %}<h1>{{ page.title }}</h1>{% endif %}
  <div class="post-body">
    {{ content }}
  </div>
  <p class="post-back"><a href="{{ '/posts/' | relative_url }}">← All posts</a></p>
</article>
