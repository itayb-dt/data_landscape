  when: "May 4"
  acquirer: SAP
  acquirer_abbr: SA
  acquirer_color: "#7cc4ff"
  target: Dremio
  target_abbr: DR
  target_color: "#c792ea"
  status: Pending
  value: Undisclosed
  headline: SAP acquires Dremio to give AI agents one governed view of SAP and non-SAP data
  tldr: "An open lakehouse, federation engine and semantic layer join SAP Business Data Cloud."
  signal: "Enterprise AI stalls on fragmented data, and customers run on more than SAP. To make agents useful, SAP has to reach everyone's data, not only its own."
  take: SAP says it will keep investing in Iceberg, Polaris and Arrow. Whether it preserves Dremio's credibility in open ecosystems is the thing to watch.
